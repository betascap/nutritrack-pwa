function totals(logs){return logs.reduce((t,x)=>{t.kcal+=Number(x.kcal)||0;t.p+=Number(x.p)||0;t.c+=Number(x.c)||0;t.f+=Number(x.f)||0;return t},{kcal:0,p:0,c:0,f:0})}function logNutrition(food,qty){let k=Number(qty)/(Number(food.serving)||100);return {kcal:round(food.kcal*k),p:round(food.p*k),c:round(food.c*k),f:round(food.f*k)}}function logsDay(date=state.date){return state.logs.filter(x=>x.date===date&&x.kind==='food').sort((a,b)=>a.time.localeCompare(b.time))}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2300)}
function progress(v,g){return Math.min(100,g>0?v/g*100:0)}function nutrCard(title,key,unit){let n=totals(logsDay())[key],g=Number(state.settings[key])||0;return `<div class="macro"><label>${title}</label><strong>${round(n)}<small style="display:inline;font-size:12px"> ${unit}</small></strong><small>de ${g}${unit} · restam ${round(Math.max(g-n,0))}${unit}</small><div class="mini"><i style="width:${progress(n,g)}%"></i></div></div>`}
function render(){document.body.classList.toggle('dark',!!state.settings.dark);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.querySelector('#addFab').classList.toggle('hidden',state.page==='settings'||state.page==='plan');let app=document.querySelector('#app');if(state.page==='today')app.innerHTML=todayPage();if(state.page==='plan')app.innerHTML=planPage();if(state.page==='calendar')app.innerHTML=calendarPage();if(state.page==='progress')app.innerHTML=progressPage();if(state.page==='settings')app.innerHTML=settingsPage();bindApp()}
function todayPage(){let ls=logsDay(),t=totals(ls),goal=Number(state.settings.kcal)||2800;let groups=['Café da manhã','Almoço','Lanche','Jantar','Outros'];let meals=groups.map(g=>{let a=ls.filter(x=>x.meal===g);return `<section><div class="sectiontitle"><h2>${g}</h2><span class="muted small">${round(totals(a).kcal)} kcal</span></div>${a.length?a.map(x=>`<div class="card meal"><div class="mealhead"><div><span class="mealname">${esc(x.foodName)}</span><small class="muted"> · ${x.qty} ${esc(x.unit)} ${x.approx?' · ≈':''}</small></div><div class="actions"><button class="linkbtn" data-edit="${x.id}">Editar</button><button class="linkbtn danger" data-del-log="${x.id}">×</button></div></div><div class="foodline"><span>${round(x.kcal)} kcal<small>P ${round(x.p)} · C ${round(x.c)} · G ${round(x.f)} g</small></span></div></div>`).join(''):`<button class="secondary small" data-add-meal="${g}">+ Adicionar</button>`}</section>`}).join('');let w=state.weights.find(x=>x.date===state.date),water=state.logs.filter(x=>x.date===state.date&&x.kind==='water').reduce((a,x)=>a+x.ml,0);return `<div class="datehead"><div><h1>${state.date===today()?'Hoje':fmtDate(state.date)}</h1><div class="muted small">${new Date(state.date+'T12:00:00').toLocaleDateString('pt-BR')}</div></div><div class="actions"><button class="iconbtn" id="prevDay">‹</button><button class="iconbtn" id="nextDay">›</button>${state.date!==today()?'<button class="linkbtn" id="goToday">Hoje</button>':''}</div></div><div class="card hero"><div class="energy"><div><div class="muted small">Energia consumida</div><div class="energy"><strong>${round(t.kcal)}</strong><span class="goal"> / ${goal} kcal</span></div></div><div class="muted small">${round(Math.max(goal-t.kcal,0))} kcal restantes</div></div><div class="progress"><i style="width:${progress(t.kcal,goal)}%"></i></div><div class="row between"><span class="muted small">${ls.length?`${ls.length} itens registrados`:'Comece registrando uma refeição'}</span><span class="tag" style="background:#ffffff25;color:white">${ls.length?'Diário em andamento':'Dia aberto'}</span></div></div><div class="macros">${nutrCard('Proteína','p','g')}${nutrCard('Carboidratos','c','g')}${nutrCard('Gorduras','f','g')}</div><div class="row between" style="margin:16px 2px"><button class="secondary" id="weightQuick">＋ Peso${w?' · '+w.kg+' kg':''}</button>${state.settings.water?`<div class="row waterbox"><span class="small">Água<br><b>${water} / ${state.settings.waterTarget} ml</b></span><button class="secondary" id="waterQuick">＋ 250 ml</button></div>`:''}</div>${meals}<div class="sectiontitle"><h2>Treino e recuperação</h2><button class="linkbtn" id="trainingQuick">＋ Registrar</button></div>${state.training.filter(x=>x.date===state.date).map(x=>`<div class="card meal"><b>${esc(x.type)}</b><span class="muted small"> · ${x.minutes} min${x.km?' · '+x.km+' km':''}${x.kcalEstimate?' · ≈ '+x.kcalEstimate+' kcal':''}</span>${x.note?`<div class="small muted">${esc(x.note)}</div>`:''}</div>`).join('')||`<div class="card meal muted small">Seu treino aparece aqui junto ao diário. Exercícios não alteram a meta de alimentação.</div>`}<div class="note">Metas iniciais são estimativas ajustáveis. Exceder uma meta não reduz sua conclusão do dia; use o diário para observar consistência.</div>`}
function planForDate(date=state.date){return state.plans.find(x=>x.date===date)||{id:date,date,items:[]}}
function shiftPlanDate(n){shiftDate(n)}
function planPage(){
  let plan=planForDate(),slots=['Café da manhã','Almoço','Lanche','Jantar','Outros'],allItems=plan.items||[];
  let sum=allItems.flatMap(x=>x.ingredients||[]).reduce((t,x)=>{t.kcal+=Number(x.kcal)||0;t.p+=Number(x.p)||0;t.c+=Number(x.c)||0;t.f+=Number(x.f)||0;return t},{kcal:0,p:0,c:0,f:0});
  let cards=slots.map(slot=>{let meals=allItems.filter(x=>x.slot===slot);return `<section><div class="sectiontitle"><h2>${slot}</h2><span class="muted small">${meals.reduce((n,m)=>n+(m.ingredients||[]).reduce((a,i)=>a+(Number(i.kcal)||0),0),0)} kcal planejadas</span></div>${meals.length?meals.map(m=>{let count=state.logs.filter(x=>x.sourcePlanItemId===m.id).length,logged=count>=(m.ingredients||[]).length,partial=count>0&&!logged;return `<div class="card meal"><div class="mealhead"><div><b>${esc(m.name)}</b><small class="muted"> · ${(m.ingredients||[]).length} ingredientes · ≈ ${(m.ingredients||[]).reduce((a,i)=>a+(Number(i.kcal)||0),0)} kcal</small></div><button class="linkbtn danger" data-plan-del="${m.id}">Remover</button></div><div>${(m.ingredients||[]).map(i=>`<div class="foodline"><span>${esc(i.foodName)}<small>${i.qty} ${esc(i.unit)}</small></span><span>${i.kcal} kcal</span></div>`).join('')}</div><button class="${logged?'secondary':'primary'}" data-plan-log="${m.id}" ${logged?'disabled':''} style="width:100%;margin-top:12px">${logged?'✓ Já lançado no diário':partial?'Completar lançamento no diário':'Lançar ingredientes no diário'}</button></div>`}).join(''):`<button class="secondary small" data-plan-slot="${slot}">＋ Planejar ${slot.toLocaleLowerCase('pt-BR')}</button>`}</section>`}).join('');
  return `<div class="datehead"><div><h1>Plano do dia</h1><div class="muted small">${fmtDate(state.date)}</div></div><div class="actions"><button class="iconbtn" id="planPrev">‹</button><button class="iconbtn" id="planNext">›</button>${state.date!==today()?'<button class="linkbtn" id="planToday">Hoje</button>':''}</div></div><div class="card"><div class="row between"><b>Refeições previstas</b><span class="tag">${allItems.length} refeições</span></div><div class="small muted" style="margin-top:6px">O plano fica separado do que você realmente registrou. Lançar refeições adiciona os ingredientes ao diário, sem substituir outros itens.</div><div class="row between" style="margin-top:12px"><span class="muted small">Total planejado</span><b>≈ ${Math.round(sum.kcal)} kcal</b></div><div class="small muted">Proteína ${Math.round(sum.p)} g · Carboidratos ${Math.round(sum.c)} g · Gorduras ${Math.round(sum.f)} g</div></div><button class="primary" id="addPlannedMeal" style="width:100%;margin:8px 0">＋ Adicionar refeição ao plano</button>${cards}<div class="note">Plano é uma referência flexível. Você pode editar o que realmente comeu no diário sem alterar o plano salvo.</div><button class="linkbtn" id="planManageMeals">Editar modelos de refeição</button>`;
}
function plannedMealModal(defaultSlot){
  if(!state.meals.length){toast('Crie um modelo de refeição primeiro');return}
  showModal(`<div class="row between"><h2>Adicionar ao plano</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Refeição do dia</label><select id="planSlot">${['Café da manhã','Almoço','Lanche','Jantar','Outros'].map(x=>`<option ${x===defaultSlot?'selected':''}>${x}</option>`).join('')}</select></div><div class="searchresults">${state.meals.map(m=>`<button class="result" data-plan-template="${m.id}"><b>${esc(m.name)}</b><small>${m.items.length} ingredientes · modelo salvo</small></button>`).join('')}</div>`);
  $('#closeModal').onclick=closeModal;
  document.querySelectorAll('[data-plan-template]').forEach(b=>b.onclick=()=>addTemplateToPlan(b.dataset.planTemplate,$('#planSlot').value));
}
async function addTemplateToPlan(templateId,slot){
  let meal=state.meals.find(x=>x.id===templateId);if(!meal)return;let ingredients=[];
  for(let it of meal.items){let food=state.foods.find(f=>f.id===it.foodId)||state.foods.find(f=>f.name===it.name);if(!food)continue;let n=logNutrition(food,it.qty);ingredients.push({id:id(),foodId:food.id,foodName:food.name,qty:Number(it.qty),unit:food.unit,kcal:n.kcal,p:n.p,c:n.c,f:n.f,approx:(food.note||'').toLowerCase().includes('estimativa')})}
  let plan=planForDate();plan.items=plan.items||[];plan.items.push({id:id(),slot,name:meal.name,ingredients});await put('plans',plan);closeModal();await refresh();toast('Refeição adicionada ao plano');
}
async function logPlannedMeal(itemId){
  let plan=planForDate(),meal=plan.items.find(x=>x.id===itemId);if(!meal)return;let ingredients=meal.ingredients||[],done=new Set(state.logs.filter(x=>x.sourcePlanItemId===itemId).map(x=>x.sourcePlanIngredientId));
  if(!ingredients.length){toast('Este modelo não tem ingredientes disponíveis');return}
  for(let i of ingredients)if(!done.has(i.id))await put('logs',{id:id(),date:state.date,time:new Date().toTimeString().slice(0,5),kind:'food',foodId:i.foodId,foodName:i.foodName,qty:i.qty,unit:i.unit,meal:meal.slot,kcal:i.kcal,p:i.p,c:i.c,f:i.f,approx:i.approx,sourcePlanItemId:itemId,sourcePlanIngredientId:i.id});
  await refresh();toast('Ingredientes lançados no diário');
}
async function removePlannedMeal(itemId){
  if(!confirm('Remover esta refeição do plano? Os registros já lançados no diário serão mantidos.'))return;
  let plan=planForDate();plan.items=plan.items.filter(x=>x.id!==itemId);await put('plans',plan);await refresh();toast('Refeição removida do plano');
}

function calendarPage(){let y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells=Array(first).fill('<div></div>');for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=state.logs.some(x=>x.date===date&&x.kind!=='water'),weight=state.weights.some(x=>x.date===date),planned=state.plans.some(x=>x.date===date&&x.items?.length);cells.push(`<button class="day ${date===state.date?'selected':''} ${date===today()?'today':''}" data-date="${date}">${d}<span class="dots">${has?'<i class="dot"></i>':''}${weight?'<i class="dot" style="background:var(--orange)"></i>':''}${planned?'<i class="dot" style="background:#8295ce"></i>':''}</span></button>`)}let t=totals(logsDay());return `<div class="datehead"><div><h1>Calendário</h1><div class="muted small">Histórico diário</div></div><button class="secondary" id="copyDay">Copiar refeições…</button></div><div class="card"><div class="calendar-head"><button class="iconbtn" id="prevMonth">‹</button><b>${monthFmt(y,m)}</b><button class="iconbtn" id="nextMonth">›</button></div><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div><div class="legend"><span><i class="dot"></i> Diário de alimentos</span><span><i class="dot" style="background:var(--orange)"></i> Peso registrado</span><span><i class="dot" style="background:#8295ce"></i> Plano</span></div></div><div class="sectiontitle"><h2>${fmtDate(state.date)}</h2><button class="linkbtn" id="addOnDate">＋ Alimento</button></div><div class="card"><div class="row between"><b>Resumo nutricional</b><span class="muted small">${round(t.kcal)} kcal</span></div><div class="small muted" style="margin-top:7px">Proteína ${round(t.p)} g · Carboidratos ${round(t.c)} g · Gorduras ${round(t.f)} g</div>${logsDay().map(x=>`<div class="listitem"><span>${esc(x.foodName)}<small class="muted"> · ${x.qty} ${esc(x.unit)} · ${x.meal}</small></span><span>${round(x.kcal)} kcal</span></div>`).join('')||'<div class="empty">Nenhum alimento registrado nesta data.</div>'}</div><div class="sectiontitle"><h2>Resumo do dia</h2><button class="linkbtn" id="addTrainingCalendar">＋ Treino</button></div>`}
function progressPage(){let w=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),filtered=state.range==='all'?w:w.filter(x=>x.date>=new Date(Date.now()-Number(state.range)*864e5).toISOString().slice(0,10));let last=w.at(-1),first=w[0],avg=w.slice(-7).length>=7?round(w.slice(-7).reduce((a,x)=>a+x.kg,0)/7):null,cur=last?.kg,change=cur&&first?round(cur-first.kg):null;let pts=filtered.map((x,i)=>({x:i/(Math.max(filtered.length-1,1))*300,y:Math.max(10,170-(x.kg-(Math.min(...filtered.map(v=>v.kg))-2))*20)}));let path=pts.map((p,i)=>`${i?'L':'M'}${p.x+20},${p.y+10}`).join(' ');return `<div class="datehead"><div><h1>Progresso</h1><div class="muted small">Tendências, sem presumir medições</div></div><button class="primary" id="addWeight">＋ Peso</button></div><div class="statgrid"><div class="stat"><span class="muted small">Peso atual</span><strong>${cur?cur+' kg':'—'}</strong><small class="muted">${last?new Date(last.date+'T12:00:00').toLocaleDateString('pt-BR'):'Sem registro'}</small></div><div class="stat"><span class="muted small">Meta inicial</span><strong>${state.settings.targetWeight} kg</strong><small class="muted">Alvo ajustável</small></div><div class="stat"><span class="muted small">Variação registrada</span><strong>${change===null?'—':(change>0?'+':'')+change+' kg'}</strong><small class="muted">desde a 1ª pesagem</small></div><div class="stat"><span class="muted small">Média de 7 pesagens</span><strong>${avg?avg+' kg':'—'}</strong><small class="muted">${avg?'últimos 7 registros':'registre 7 medições'}</small></div></div><div class="card"><div class="row between" style="margin-bottom:14px"><b>Histórico de peso</b></div><div class="range">${[['7','7 dias'],['30','30 dias'],['90','90 dias'],['all','Tudo']].map(([v,l])=>`<button data-range="${v}" class="${String(state.range)===v?'active':''}">${l}</button>`).join('')}</div>${filtered.length?`<svg class="chart" viewBox="0 0 340 210" preserveAspectRatio="none"><path d="M20 190H330" stroke="var(--line)"/><path d="${path}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x+20}" cy="${p.y+10}" r="4" fill="var(--green)"/><text x="${p.x+20}" y="${p.y}" text-anchor="middle" font-size="10" fill="var(--muted)">${filtered[i].kg}</text>`).join('')}</svg>`:'<div class="empty">Registre seu peso para ver as medições reais em um gráfico.</div>'}</div><div class="sectiontitle"><h2>Pesagens</h2><span class="muted small">${w.length} registros</span></div><div class="card">${w.slice().reverse().map(x=>`<div class="listitem"><span>${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}${x.waist?`<small class="muted"> · Cintura ${x.waist} cm</small>`:''}</span><span><b>${x.kg} kg</b> <button class="linkbtn danger" data-del-weight="${x.id}">×</button></span></div>`).join('')||'<div class="empty">Sem pesagens salvas.</div>'}</div><div class="note">A linha conecta apenas medições reais. Oscilações diárias não são tratadas como mudança de gordura corporal.</div>`}
function settingsPage(){let s=state.settings;return `<div class="datehead"><div><h1>Ajustes</h1><div class="muted small">Tudo permanece neste dispositivo</div></div></div><div class="card"><h2>Metas diárias</h2><div class="grid2">${field('Calorias (kcal)','kcal',s.kcal,'number')}${field('Proteína (g)','p',s.p,'number')}${field('Carboidratos (g)','c',s.c,'number')}${field('Gorduras (g)','f',s.f,'number')}</div><div class="note">Metas de partida, não prescrição médica. Ajuste conforme peso, treino e recuperação.</div><button class="primary" id="saveTargets">Salvar metas</button></div><div class="card"><h2>Perfil pessoal</h2><div class="grid2">${field('Altura (cm)','height',s.height,'number')}${field('Peso-alvo (kg)','targetWeight',s.targetWeight,'number')}</div><div class="muted small">Peso inicial informado: 102 kg · Composição corporal: massa muscular relativamente alta.</div></div><div class="card"><h2>Preferências</h2><label class="row between"><span>Modo escuro</span><input class="toggle" type="checkbox" id="darkToggle" ${s.dark?'checked':''}></label><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label class="row between"><span>Hidratação no diário</span><input class="toggle" type="checkbox" id="waterToggle" ${s.water?'checked':''}></label><div class="field"><label>Meta de água (ml)</label><input id="waterTarget" type="number" value="${s.waterTarget}" min="0"></div></div><div class="card"><h2>Alimentos e refeições</h2><div class="row"><button class="secondary" id="manageFoods">Editar alimentos</button><button class="secondary" id="manageMeals">Modelos de refeição</button></div></div><div class="card"><h2>Seus dados</h2><div class="row" style="flex-wrap:wrap"><button class="secondary" id="exportJson">Exportar backup JSON</button><button class="secondary" id="importJson">Restaurar backup</button><input id="importFile" type="file" accept="application/json" class="hidden"><button class="secondary" id="csvLogs">CSV · alimentos</button><button class="secondary" id="csvWeights">CSV · peso</button><button class="secondary" id="csvTraining">CSV · treinos</button><button class="secondary" id="exportXlsx">Exportar Excel (.xlsx)</button></div><div class="note">O Excel reúne todos os dias registrados em abas de diário, treinos, pesagens, plano, alimentos e metas. A exportação é feita neste aparelho; nada é enviado automaticamente. Seus registros são guardados localmente pelo navegador. Limpar os dados do Safari pode apagá-los; mantenha um backup.</div><button class="linkbtn danger" id="clearAll">Apagar todos os dados locais…</button></div><div class="card"><h2>Privacidade e hospedagem</h2><div class="small muted">NutriTrack não usa login, analytics ou sincronização. Os registros ficam localmente no aparelho. Estado de armazenamento persistente: ${state.storagePersistent===true?'concedido pelo navegador':state.storagePersistent===false?'não concedido; exporte backups com frequência':'indisponível neste contexto'}. Em publicação estática, o provedor serve apenas os arquivos do app. PWA e modo offline exigem HTTPS na hospedagem inicial. Dados locais ainda podem ser apagados se o usuário limpar os dados, remover o app ou o iPhone precisar liberar espaço.</div><button class="secondary" id="requestPersistence" ${state.storagePersistent===true?"disabled":""}>Solicitar armazenamento persistente</button></div></div>`}
function field(label,key,val,type='text'){return `<div class="field"><label>${label}</label><input data-setting="${key}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="any"':''}></div>`}
function bindApp(){document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.date=b.dataset.date;state.page='today';render()});document.querySelectorAll('[data-del-log]').forEach(b=>b.onclick=()=>deleteLog(b.dataset.delLog));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.edit));document.querySelectorAll('[data-del-weight]').forEach(b=>b.onclick=()=>deleteWeight(b.dataset.delWeight));document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;render()});$('#prevDay')?.addEventListener('click',()=>shiftDate(-1));$('#nextDay')?.addEventListener('click',()=>shiftDate(1));$('#goToday')?.addEventListener('click',()=>{state.date=today();render()});$('#prevMonth')?.addEventListener('click',()=>moveMonth(-1));$('#nextMonth')?.addEventListener('click',()=>moveMonth(1));$('#addOnDate')?.addEventListener('click',()=>foodModal());$('#copyDay')?.addEventListener('click',copyDay);$('#addFab')?.addEventListener('click',()=>foodModal());$('#weightQuick')?.addEventListener('click',weightModal);$('#addWeight')?.addEventListener('click',weightModal);$('#planManageMeals')?.addEventListener('click',manageMeals);$('#trainingQuick')?.addEventListener('click',trainingModal);$('#planPrev')?.addEventListener('click',()=>shiftPlanDate(-1));$('#planNext')?.addEventListener('click',()=>shiftPlanDate(1));$('#planToday')?.addEventListener('click',()=>{state.date=today();render()});$('#addPlannedMeal')?.addEventListener('click',()=>plannedMealModal());document.querySelectorAll('[data-plan-slot]').forEach(b=>b.onclick=()=>plannedMealModal(b.dataset.planSlot));document.querySelectorAll('[data-plan-template]').forEach(b=>b.onclick=()=>addTemplateToPlan(b.dataset.planTemplate,$('#planSlot').value));document.querySelectorAll('[data-plan-log]').forEach(b=>b.onclick=()=>logPlannedMeal(b.dataset.planLog));document.querySelectorAll('[data-plan-del]').forEach(b=>b.onclick=()=>removePlannedMeal(b.dataset.planDel));$('#addTrainingCalendar')?.addEventListener('click',trainingModal);$('#waterQuick')?.addEventListener('click',addWater);$('#saveTargets')?.addEventListener('click',saveSettings);$('#darkToggle')?.addEventListener('change',e=>{state.settings.dark=e.target.checked;saveSettings()});$('#waterToggle')?.addEventListener('change',e=>{state.settings.water=e.target.checked;saveSettings()});$('#themeBtn').onclick=()=>{state.settings.dark=!state.settings.dark;saveSettings()};$('#manageFoods')?.addEventListener('click',manageFoods);$('#manageMeals')?.addEventListener('click',manageMeals);$('#exportJson')?.addEventListener('click',exportJson);$('#importJson')?.addEventListener('click',()=>$('#importFile').click());$('#importFile')?.addEventListener('change',importJson);$('#csvLogs')?.addEventListener('click',()=>exportCsv('logs'));$('#csvWeights')?.addEventListener('click',()=>exportCsv('weights'));$('#csvTraining')?.addEventListener('click',()=>exportCsv('training'));$('#exportXlsx')?.addEventListener('click',exportXlsx);$('#clearAll')?.addEventListener('click',clearAll);$('#requestPersistence')?.addEventListener('click',async()=>{state.storagePersistent=await requestStoragePersistence();render();toast(state.storagePersistent===true?'Armazenamento persistente concedido':'O navegador não concedeu armazenamento persistente')});document.querySelectorAll('[data-add-meal]').forEach(b=>b.onclick=()=>foodModal(b.dataset.addMeal))}
function $(s){return document.querySelector(s)}function shiftDate(n){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+n);state.date=d.toLocaleDateString('sv-SE');render()}function moveMonth(n){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);render()}function showModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show');$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}}function closeModal(){$('#modal').classList.remove('show')}
function foodModal(meal='Lanche',existing=null){state.editLog=existing;let old=existing?state.logs.find(x=>x.id===existing):null;state.selectedMeal=old?.meal||meal;showModal(`<div class="row between"><h2>${old?'Editar item':'Adicionar alimentos'}</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Adicionar em</label><select id="mealTarget">${['Café da manhã','Almoço','Lanche','Jantar','Outros'].map(x=>`<option ${x===state.selectedMeal?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Buscar alimento</label><input id="foodSearch" placeholder="Ex.: arroz, banana…" autocomplete="off"></div><div class="row" style="gap:6px;flex-wrap:wrap"><button class="secondary small" data-fav="1">★ Favoritos</button><button class="secondary small" data-quickmeal="1">Modelos de refeição</button><button class="secondary small" id="newFood">＋ Criar alimento</button></div><div class="searchresults" id="results"></div><div id="picked">${old?pickedForm(state.foods.find(f=>f.id===old.foodId)||{name:old.foodName,unit:old.unit,serving:old.qty,kcal:old.kcal,p:old.p,c:old.c,f:old.f,note:old.approx?'Estimativa':''},old):''}</div><button class="secondary" id="doneAdding" style="width:100%;margin-top:10px">Concluir</button>`);$('#closeModal').onclick=closeModal;$('#doneAdding').onclick=closeModal;$('#mealTarget').onchange=()=>{state.selectedMeal=$('#mealTarget').value};let search=$('#foodSearch');search.oninput=()=>drawResults(search.value);document.querySelector('[data-fav]').onclick=()=>drawResults(search.value,true);document.querySelector('[data-quickmeal]').onclick=showMealPicker;$('#newFood').onclick=newFoodModal;drawResults('');}
function drawResults(q,fav=false){let a=state.foods.filter(x=>(!fav||x.favorite)&&x.name.toLocaleLowerCase('pt-BR').includes(q.toLocaleLowerCase('pt-BR'))).slice(0,9);$('#results').innerHTML=a.map(x=>`<button class="result" data-pick="${x.id}">${x.favorite?'★ ':''}${esc(x.name)}<small>${round(x.kcal)} kcal · ${round(x.p)} P / ${round(x.c)} C / ${round(x.f)} G por ${x.serving}${esc(x.unit)} · ${esc(x.note||'Rótulo')}</small></button>`).join('')+(!a.length?'<div class="empty">Sem resultado. Crie um alimento personalizado.</div>':'');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{$('#picked').innerHTML=pickedForm(state.foods.find(x=>x.id===b.dataset.pick));$('#results').innerHTML='';bindPicked()})}
function pickedForm(f,old=null){return `<div class="selected-food"><b>${esc(f.name)}</b><div class="small muted">${round(f.kcal)} kcal por ${f.serving||100} ${esc(f.unit||'g')} · ${esc(f.note||'Estimativa')}</div></div><input type="hidden" id="pickedId" value="${esc(f.id||'custom')}"/><div class="field"><label>Quantidade (${esc(f.unit||'g')})</label><input id="qty" type="number" min="0.1" step="any" value="${old?.qty||f.serving||100}"></div><div class="row" style="gap:8px"><button class="secondary" id="qtyMinus">−</button><button class="secondary" id="qtyPlus">＋</button><span class="muted small" id="calcPreview"></span></div><button class="primary" id="saveLog" style="width:100%;margin-top:14px">${old?'Salvar alterações':'Adicionar este alimento'}</button>`}
function bindPicked(){let qty=$('#qty'),f=state.foods.find(x=>x.id===$('#pickedId').value)||null;function calc(){if(!qty)return;let v=Number(qty.value);if(!Number.isFinite(v)||v<=0){$('#calcPreview').textContent='Informe uma quantidade válida';return}let n=f?logNutrition(f,v):{kcal:0,p:0,c:0,f:0};$('#calcPreview').textContent=`${n.kcal} kcal · P ${n.p} g`};qty?.addEventListener('input',calc);calc();$('#qtyMinus').onclick=()=>{qty.value=String(Math.max(.1,Number(qty.value)-(f?.serving||1)));calc()};$('#qtyPlus').onclick=()=>{qty.value=String(Number(qty.value)+(f?.serving||1));calc()};$('#saveLog').onclick=async()=>{let q=Number(qty.value);if(!Number.isFinite(q)||q<=0){toast('Quantidade inválida');return}let editing=!!state.editLog,food=f;if(!food){let name=$('#customName')?.value||'Alimento personalizado';food={id:'tmp',name,unit:'g',serving:100,kcal:Number($('#customKcal')?.value)||0,p:Number($('#customP')?.value)||0,c:Number($('#customC')?.value)||0,f:Number($('#customF')?.value)||0,note:'Personalizado'}}let meal=$('#mealTarget')?.value||state.selectedMeal;state.selectedMeal=meal;let n=logNutrition(food,q),obj={id:state.editLog||id(),date:state.date,time:new Date().toTimeString().slice(0,5),kind:'food',foodId:food.id,foodName:food.name,qty:q,unit:food.unit,meal,...n,approx:(food.note||'').toLowerCase().includes('estimativa')||food.note?.toLowerCase().includes('informe')};await put('logs',obj);state.editLog=null;if(editing){closeModal();await refresh();toast('Alterações salvas')}else{await refresh();$('#picked').innerHTML='';$('#foodSearch').value='';drawResults('');$('#foodSearch').focus();toast(`${food.name} adicionado a ${meal}. Você pode adicionar outro.`)}};}
function editEntry(key){foodModal('Lanche',key)}async function deleteLog(k){if(confirm('Apagar este registro do diário?')){await del('logs',k);await refresh();toast('Registro removido')}}async function deleteWeight(k){if(confirm('Apagar esta pesagem?')){await del('weights',k);await refresh()}}
function newFoodModal(){showModal(`<div class="row between"><h2>Novo alimento</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Nome</label><input id="nfName" placeholder="Nome do alimento"></div><div class="grid2"><div class="field"><label>Categoria</label><input id="nfCat" value="Personalizados"></div><div class="field"><label>Unidade base</label><select id="nfUnit"><option>g</option><option>ml</option><option>unidade</option><option>fatia</option><option>colher</option><option>porção</option><option>medida</option></select></div></div><div class="grid2">${[['Calorias','kcal'],['Proteína (g)','p'],['Carboidratos (g)','c'],['Gorduras (g)','f']].map(([l,k])=>`<div class="field"><label>${l} por 100 unidades</label><input type="number" step="any" min="0" id="nf${k}"></div>`).join('')}</div><div class="field"><label>Fonte / observação</label><input id="nfNote" value="Estimativa" placeholder="Rótulo do produto, estimativa…"></div><button class="primary" id="saveFood" style="width:100%">Salvar alimento</button>`);$('#closeModal').onclick=closeModal;$('#saveFood').onclick=async()=>{let name=$('#nfName').value.trim();if(!name){toast('Informe o nome');return}let x={id:id(),name,category:$('#nfCat').value,unit:$('#nfUnit').value,serving:100,kcal:Number($('#nfkcal').value)||0,p:Number($('#nfp').value)||0,c:Number($('#nfc').value)||0,f:Number($('#nff').value)||0,note:$('#nfNote').value||'Estimativa',favorite:false};await put('foods',x);await refresh();foodModal(state.selectedMeal);toast('Alimento salvo')};}
function weightModal(){showModal(`<div class="row between"><h2>Registrar peso</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Data</label><input id="wDate" type="date" value="${state.date}"></div><div class="grid2"><div class="field"><label>Peso (kg)</label><input id="wKg" type="number" min="20" max="350" step=".1" placeholder="102,0"></div><div class="field"><label>Cintura (cm) · opcional</label><input id="wWaist" type="number" min="1" step=".1"></div></div><button class="primary" id="saveWeight" style="width:100%">Salvar pesagem</button>`);$('#closeModal').onclick=closeModal;$('#saveWeight').onclick=async()=>{let kg=Number($('#wKg').value);if(!kg||kg<20||kg>350){toast('Confira o peso informado');return}let date=$('#wDate').value;let old=state.weights.find(x=>x.date===date);await put('weights',{id:old?.id||id(),date,kg,waist:Number($('#wWaist').value)||null});state.date=date;closeModal();await refresh();toast('Pesagem salva')}}
function trainingModal(){showModal(`<div class="row between"><h2>Treino e recuperação</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Data</label><input type="date" id="tDate" value="${state.date}"></div><div class="field"><label>Atividade</label><select id="tType"><option>Corrida</option><option>Musculação</option><option>Jiu-jítsu</option></select></div><div class="grid2"><div class="field"><label>Duração (min)</label><input type="number" id="tMin" min="1"></div><div class="field"><label>Distância (km) · corrida, se souber</label><input type="number" id="tKm" min="0" step=".1"></div></div><div class="field"><label>Esforço percebido (1–10) · opcional</label><input type="number" id="tEffort" min="1" max="10"></div><div class="field"><label>Energia, recuperação, dores · opcional</label><textarea id="tNote" rows="2"></textarea></div><div class="note" id="tEstimate">Informe a duração para calcular uma estimativa aproximada.</div><button class="primary" id="saveTraining" style="width:100%">Salvar treino</button>`);$('#closeModal').onclick=closeModal;const getEstimate=()=>{let date=$('#tDate').value;let prior=[...state.weights].filter(w=>w.date<=date).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return window.estimateExerciseCalories({type:$('#tType').value,minutes:$('#tMin').value,distanceKm:$('#tKm').value,effort:$('#tEffort').value,weightKg:prior?.kg||102})};const updateEstimate=()=>{let x=getEstimate();$('#tEstimate').textContent=x?`Estimativa: ≈${x.kcal} kcal · baseada em ${x.weightKg} kg e intensidade média (${x.met} MET). É um valor aproximado do gasto total durante a sessão e não altera sua meta alimentar.`:'Informe a duração para calcular uma estimativa aproximada.'};['#tDate','#tType','#tMin','#tKm','#tEffort'].forEach(sel=>$(sel).addEventListener('input',updateEstimate));$('#tType').addEventListener('change',updateEstimate);$('#tDate').addEventListener('change',updateEstimate);updateEstimate();$('#saveTraining').onclick=async()=>{let min=Number($('#tMin').value);if(min<=0){toast('Informe a duração');return}let date=$('#tDate').value,estimate=getEstimate();await put('training',{id:id(),date,type:$('#tType').value,minutes:min,km:Number($('#tKm').value)||null,effort:Number($('#tEffort').value)||null,note:$('#tNote').value,kcalEstimate:estimate?.kcal||null,estimateWeightKg:estimate?.weightKg||null,estimateMet:estimate?.met||null});closeModal();await refresh();toast('Treino registrado') }}
async function addWater(){let ml=250;await put('logs',{id:id(),date:state.date,time:new Date().toTimeString().slice(0,5),kind:'water',ml});await refresh();toast(`+${ml} ml registrados`)}
async function saveSettings(){document.querySelectorAll('[data-setting]').forEach(e=>{let n=e.dataset.setting;state.settings[n]=Number(e.value)||0});if($('#waterTarget'))state.settings.waterTarget=Number($('#waterTarget').value)||2500;await put('settings',{id:'main',...state.settings});await refresh();toast('Ajustes salvos')}
function showMealPicker(){showModal(`<div class="row between"><h2>Modelos de refeição</h2><button class="iconbtn" id="closeModal">×</button></div><div class="searchresults">${state.meals.map(m=>`<button class="result" data-template="${m.id}"><b>${esc(m.name)}</b><small>${m.items.length} ingredientes</small></button>`).join('')}<button class="result" id="newTemplate">＋ Criar modelo</button></div>`);$('#closeModal').onclick=closeModal;$('#newTemplate').onclick=()=>templateEditor();document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>applyTemplate(b.dataset.template))}
async function applyTemplate(k){let m=state.meals.find(x=>x.id===k);if(!m)return;let resolved=m.items.map(it=>({food:state.foods.find(f=>f.id===it.foodId)||state.foods.find(f=>f.name===it.name),qty:it.qty}));if(resolved.some(x=>!x.food)){toast('Um ingrediente não está disponível');return}let existing=logsDay().length;if(existing&&!confirm(`Adicionar ${m.name} ao dia? Os registros existentes serão mantidos.`))return;for(let x of resolved){let n=logNutrition(x.food,x.qty);await put('logs',{id:id(),date:state.date,time:new Date().toTimeString().slice(0,5),kind:'food',foodId:x.food.id,foodName:x.food.name,qty:x.qty,unit:x.food.unit,meal:m.name.includes('Café')?'Café da manhã':m.name.includes('Almoço')?'Almoço':m.name.includes('Jantar')?'Jantar':'Lanche',...n,approx:(x.food.note||'').includes('Estimativa')})}closeModal();await refresh();toast('Refeição adicionada')}
function templateEditor(){showModal(`<div class="row between"><h2>Criar modelo</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Nome do modelo</label><input id="mealName" placeholder="Ex.: Meu almoço"></div><div class="field"><label>Ingredientes · selecione alimentos e quantidades</label><input id="mealFind" placeholder="Buscar ingrediente"></div><div class="searchresults" id="mealResults"></div><div id="mealItems" class="small"></div><button class="primary" id="saveTemplate" style="width:100%;margin-top:12px">Salvar modelo</button>`);$('#closeModal').onclick=closeModal;let items=[];const draw=()=>{$('#mealItems').innerHTML=items.map((x,i)=>`<div class="listitem">${esc(x.name)} · ${x.qty} ${esc(x.unit)} <button data-mi="${i}" class="linkbtn danger">×</button></div>`).join('');document.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.mi,1);draw()})};$('#mealFind').oninput=()=>{$('#mealResults').innerHTML=state.foods.filter(f=>f.name.toLowerCase().includes($('#mealFind').value.toLowerCase())).slice(0,6).map(f=>`<button class="result" data-mf="${f.id}">${esc(f.name)}</button>`).join('');document.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id===b.dataset.mf),qty=prompt(`Quantidade em ${f.unit}`,f.serving);if(qty&&Number(qty)>0){items.push({foodId:f.id,name:f.name,qty:Number(qty),unit:f.unit});draw()}})};$('#saveTemplate').onclick=async()=>{let name=$('#mealName').value.trim();if(!name||!items.length){toast('Informe nome e ingredientes');return}await put('meals',{id:id(),name,items});closeModal();await refresh();toast('Modelo salvo')}}
function copyDay(){let dates=[...new Set(state.logs.filter(x=>x.kind==='food').map(x=>x.date))].sort().reverse();if(!dates.length){toast('Ainda não há refeições para copiar');return}showModal(`<div class="row between"><h2>Copiar refeições</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Copiar de</label><select id="copyFrom">${dates.map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('')}</select></div><div class="field"><label>Copiar para</label><input id="copyTo" type="date" value="${state.date}"></div><div class="note">As refeições serão adicionadas à data de destino. Nenhum registro atual será apagado.</div><button class="primary" id="doCopy" style="width:100%">Copiar refeições</button>`);$('#closeModal').onclick=closeModal;$('#doCopy').onclick=async()=>{let from=$('#copyFrom').value,to=$('#copyTo').value;if(!to){toast('Escolha uma data');return}let orig=state.logs.filter(x=>x.date===from&&x.kind==='food');if(state.logs.some(x=>x.date===to&&x.kind==='food')&&!confirm('Já existem alimentos nessa data. Adicionar as refeições sem apagar os registros atuais?'))return;for(let x of orig)await put('logs',{...x,id:id(),date:to,time:new Date().toTimeString().slice(0,5)});state.date=to;closeModal();await refresh();toast(`${orig.length} itens copiados`)}}
function manageFoods(){showModal(`<div class="row between"><h2>Alimentos</h2><button class="iconbtn" id="closeModal">×</button></div><button class="primary" id="addFoodManage">＋ Novo alimento</button><div class="field"><label>Buscar</label><input id="manageSearch"></div><div id="foodList"></div>`);$('#closeModal').onclick=closeModal;$('#addFoodManage').onclick=newFoodModal;let draw=()=>{$('#foodList').innerHTML=state.foods.filter(f=>f.name.toLowerCase().includes($('#manageSearch').value.toLowerCase())).map(f=>`<div class="listitem"><span>${f.favorite?'★ ':''}${esc(f.name)}<small class="muted">${round(f.kcal)} kcal/${f.serving}${esc(f.unit)}</small></span><span><button class="linkbtn" data-star="${f.id}">☆</button><button class="linkbtn" data-food-edit="${f.id}">Editar</button>${!f.seed?`<button class="linkbtn danger" data-food-del="${f.id}">×</button>`:''}</span></div>`).join('');document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async()=>{let f=state.foods.find(x=>x.id===b.dataset.star);f.favorite=!f.favorite;await put('foods',f);await refresh();manageFoods()});document.querySelectorAll('[data-food-edit]').forEach(b=>b.onclick=()=>editFood(b.dataset.foodEdit));document.querySelectorAll('[data-food-del]').forEach(b=>b.onclick=async()=>{if(confirm('Apagar este alimento? Registros anteriores são preservados.')){await del('foods',b.dataset.foodDel);await refresh();manageFoods()}})};$('#manageSearch').oninput=draw;draw()}
function editFood(k){let f=state.foods.find(x=>x.id===k);if(!f)return;showModal(`<div class="row between"><h2>Editar alimento</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Nome</label><input id="efName" value="${esc(f.name)}"></div><div class="grid2">${[['Calorias','kcal'],['Proteína','p'],['Carboidratos','c'],['Gorduras','f']].map(([l,k])=>`<div class="field"><label>${l}</label><input id="ef${k}" type="number" step="any" value="${f[k]}"></div>`).join('')}</div><div class="grid2"><div class="field"><label>Base (quantidade)</label><input id="efServing" type="number" value="${f.serving}"></div><div class="field"><label>Unidade</label><input id="efUnit" value="${esc(f.unit)}"></div></div><div class="field"><label>Fonte / observação</label><input id="efNote" value="${esc(f.note||'')}"></div><button class="primary" id="saveEditFood">Salvar</button>`);$('#closeModal').onclick=closeModal;$('#saveEditFood').onclick=async()=>{f.name=$('#efName').value.trim()||f.name;for(let k of ['kcal','p','c','f','serving'])f[k]=Number($('#ef'+k).value)||0;f.unit=$('#efUnit').value;f.note=$('#efNote').value;await put('foods',f);closeModal();await refresh();manageFoods();toast('Alimento atualizado')}}
function manageMeals(){showModal(`<div class="row between"><h2>Modelos de refeição</h2><button class="iconbtn" id="closeModal">×</button></div><button class="primary" id="addMealManage">＋ Criar modelo</button>${state.meals.map(m=>`<div class="listitem"><span>${esc(m.name)}<small class="muted">${m.items.length} ingredientes</small></span><button class="linkbtn danger" data-meal-del="${m.id}">Excluir</button></div>`).join('')}`);$('#closeModal').onclick=closeModal;$('#addMealManage').onclick=templateEditor;document.querySelectorAll('[data-meal-del]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este modelo?')){await del('meals',b.dataset.mealDel);await refresh();manageMeals()}})}
function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}async function exportJson(){let data={app:'NutriTrack',version:2,exportedAt:new Date().toISOString(),foods:state.foods,logs:state.logs,weights:state.weights,training:state.training,meals:state.meals,plans:state.plans,settings:state.settings};download('nutritrack-backup-'+today()+'.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}))}function exportCsv(key){let rows=state[key];let cols=key==='logs'?['date','time','foodName','qty','unit','meal','kcal','p','c','f']:key==='weights'?['date','kg','waist']:['date','type','minutes','km','effort','kcalEstimate','note'];let csv=[cols.join(';'),...rows.map(x=>cols.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\r\n');download(`nutritrack-${key}-${today()}.csv`,new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}))}

async function importJson(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='NutriTrack'||!Array.isArray(x.foods)||!Array.isArray(x.logs)||!Array.isArray(x.weights))throw Error('Formato de backup inválido');if(!confirm('Restaurar este backup substituirá os dados locais atuais. Deseja continuar?'))return;for(let st of ['foods','logs','weights','training','meals','settings','plans']){let tx=db.transaction(st,'readwrite');tx.objectStore(st).clear();for(let item of (st==='settings'?[{id:'main',...(x.settings||{})}]:x[st]||[]))tx.objectStore(st).put(item)}await refresh();toast('Backup restaurado')}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}}async function clearAll(){if(!confirm('Apagar todos os alimentos, diários, pesagens e ajustes deste aparelho? Esta ação não pode ser desfeita.'))return;for(let st of ['foods','logs','weights','training','meals','settings','plans'])await new Promise(ok=>{let q=db.transaction(st,'readwrite').objectStore(st).clear();q.onsuccess=ok});await initData();await refresh();toast('Dados locais apagados')}

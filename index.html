function drawResults(q,fav=false){let recent=[];if(!q.trim()&&!fav){let seen=new Set();recent=state.logs.filter(x=>x.kind==='food'&&state.foods.some(f=>f.id===x.foodId)).slice().sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).filter(x=>{let k=x.foodId||x.foodName;if(seen.has(k))return false;seen.add(k);return true}).slice(0,10).map(x=>state.foods.find(f=>f.id===x.foodId)||{id:x.foodId,name:x.foodName,unit:x.unit,serving:x.qty,kcal:x.kcal,p:x.p,c:x.c,f:x.f,note:'Último registro'})}let a=state.foods.filter(x=>(!fav||x.favorite)&&(x.name.toLocaleLowerCase('pt-BR').includes(q.toLocaleLowerCase('pt-BR'))||(x.aliases||[]).some(n=>n.toLocaleLowerCase('pt-BR').includes(q.toLocaleLowerCase('pt-BR'))))).slice(0,9);$('#results').innerHTML=(q.trim()?'':recent.length?`<div class="small muted">Recentes</div>${recent.map(x=>`<button class="result" data-pick="${x.id}" ${x.pendingLabel||x.unusable?'disabled':''}>${esc(x.name)}<small>${x.pendingLabel?'Configure os valores do rótulo em Ajustes → Alimentos':`${round(x.kcal)} kcal · recente`}</small></button>`).join('')}`:'')+a.map(x=>`<button class="result" data-pick="${x.id}" ${x.pendingLabel||x.unusable?'disabled':''}>${x.favorite?'★ ':''}${esc(x.name)}<small>${x.unusable?'Macros indisponíveis':x.pendingLabel?'Valores pendentes · informe o rótulo em Ajustes → Alimentos':`${macroText(x,'kcal')} kcal · ${macroText(x,'p')} P / ${macroText(x,'c')} C / ${macroText(x,'f')} G por ${x.serving}${esc(x.unit)}`}</small></button>`).join('')+(!a.length&&!recent.length?'<div class="empty">Sem resultado. Crie um alimento personalizado.</div>':'');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{$('#picked').innerHTML=pickedForm(state.foods.find(x=>x.id===b.dataset.pick)||recent.find(x=>x.id===b.dataset.pick));$('#results').innerHTML='';bindPicked()})}
function parseMeasures(text){return String(text||'').split(/\n/).map(line=>{let m=line.trim().match(/^(.+?)\s*(?:=|:)\s*([0-9]+(?:[.,][0-9]+)?)\s*(?:g|gramas?)?$/i);return m?{name:m[1].trim(),grams:Number(m[2].replace(',','.'))}:null}).filter(x=>x&&x.name&&x.grams>0)}function pickedForm(f,old=null){return `<div class="selected-food"><b>${esc(f.name)}</b><div class="small muted">${macroText(f,'kcal')} kcal por ${f.serving||100} ${esc(f.unit||'g')} · P ${macroText(f,'p')} / C ${macroText(f,'c')} / G ${macroText(f,'f')} g · ${esc(f.note||'')}</div></div><input type="hidden" id="pickedId" value="${esc(f.id||'custom')}"/>${f.unit==='g'&&(f.measures||[]).length?`<div class="field"><label>Medida caseira</label><select id="measurePick"><option value="">Escolher uma medida</option>${f.measures.map((m,i)=>`<option value="${i}">${esc(m.name)} · ${m.grams} g</option>`).join('')}</select></div>`:''}<div class="field"><label>Quantidade (${esc(f.unit||'g')})</label><input id="qty" type="number" min="0.1" step="any" value="${old?.qty||f.serving||100}"></div><div class="row" style="gap:8px"><button class="secondary" id="qtyMinus">−</button><button class="secondary" id="qtyPlus">＋</button><span class="muted small" id="calcPreview"></span></div><button class="primary" id="saveLog" style="width:100%;margin-top:14px">${old?'Salvar alterações':'Adicionar este alimento'}</button>`}
function bindPicked(){let qty=$('#qty'),saved=state.editLog?state.logs.find(x=>x.id===state.editLog):null,selected=state.foods.find(x=>x.id===$('#pickedId').value),f=saved&&(selected?.pendingLabel||!selected)?foodFromSavedLog(saved):selected;function calc(){if(!qty)return;let v=Number(qty.value);if(!Number.isFinite(v)||v<=0){$('#calcPreview').textContent='Informe uma quantidade válida';return}let n=f?logNutrition(f,v):{kcal:0,p:0,c:0,f:0};$('#calcPreview').textContent=`${n.kcal} kcal · P ${n.p} g`};qty?.addEventListener('input',calc);$('#measurePick')?.addEventListener('change',e=>{if(e.target.value==='')return;let m=f?.measures?.[Number(e.target.value)];if(m){qty.value=String(m.grams);calc()}});calc();$('#qtyMinus').onclick=()=>{qty.value=String(Math.max(.1,Number(qty.value)-(f?.serving||1)));calc()};$('#qtyPlus').onclick=()=>{qty.value=String(Number(qty.value)+(f?.serving||1));calc()};$('#saveLog').onclick=async()=>{let q=Number(qty.value);if(!Number.isFinite(q)||q<=0){toast('Quantidade inválida');return}if(f?.unusable){toast('A TACO não traz valores nutricionais para este alimento');return}let editing=!!state.editLog,food=f;if(!food){let name=$('#customName')?.value||'Alimento personalizado';food={id:'tmp',name,unit:'g',serving:100,kcal:Number($('#customKcal')?.value)||0,p:Number($('#customP')?.value)||0,c:Number($('#customC')?.value)||0,f:Number($('#customF')?.value)||0,note:'Personalizado'}}let meal=$('#mealTarget')?.value||state.selectedMeal;state.selectedMeal=meal;let n=logNutrition(food,q),obj={id:state.editLog||id(),date:state.date,time:editing?(state.logs.find(x=>x.id===state.editLog)?.time||new Date().toTimeString().slice(0,5)):new Date().toTimeString().slice(0,5),kind:'food',foodId:food.id,foodName:food.name,qty:q,unit:food.unit,meal,...n,unknownMacros:food.unknownMacros||[],approx:(food.note||'').toLowerCase().includes('estimativa')||food.note?.toLowerCase().includes('informe')};await put('logs',obj);state.editLog=null;if(editing){closeModal();await refresh();toast('Alterações salvas')}else{await refresh();$('#picked').innerHTML='';$('#foodSearch').value='';drawResults('');$('#foodSearch').focus();toast(`${food.name} adicionado a ${meal}. Você pode adicionar outro.`)}};}

function trainingModal(existingId=null){let old=existingId?state.training.find(x=>x.id===existingId):null;showModal(`<div class="row between"><h2>${old?'Editar treino':'Treino e recuperação'}</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Data</label><input type="date" id="tDate" value="${old?.date||state.date}"></div><div class="field"><label>Atividade</label><select id="tType">${['Corrida','Musculação','Jiu-jítsu'].map(x=>`<option ${x===(old?.type||'Corrida')?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Duração (min)</label><input type="number" id="tMin" min="1" value="${old?.minutes||''}"></div><div class="field"><label>Distância (km) · corrida, se souber</label><input type="number" id="tKm" min="0" step=".1" value="${old?.km||''}"></div></div><div class="field"><label>Esforço percebido (1–10) · opcional</label><input type="number" id="tEffort" min="1" max="10" value="${old?.effort||''}"></div><div class="field"><label>Energia, recuperação, dores · opcional</label><textarea id="tNote" rows="2">${esc(old?.note||'')}</textarea></div><div class="note" id="tEstimate">Informe a duração para calcular uma estimativa aproximada.</div><button class="primary" id="saveTraining" style="width:100%">Salvar treino</button>`);$('#closeModal').onclick=closeModal;const getEstimate=()=>{let date=$('#tDate').value,prior=[...state.weights].filter(w=>w.date<=date).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return window.estimateExerciseCalories({type:$('#tType').value,minutes:$('#tMin').value,distanceKm:$('#tKm').value,effort:$('#tEffort').value,weightKg:prior?.kg||Number(state.settings.initialWeight)})};const updateEstimate=()=>{let x=getEstimate();$('#tEstimate').textContent=x?`Estimativa: ≈${x.kcal} kcal · baseada em ${x.weightKg} kg e intensidade média (${x.met} MET). É um valor aproximado do gasto total durante a sessão e não altera sua meta alimentar.`:'Informe duração e defina o peso inicial em Ajustes ou registre uma pesagem.'};['#tDate','#tType','#tMin','#tKm','#tEffort'].forEach(sel=>$(sel).addEventListener('input',updateEstimate));$('#tType').addEventListener('change',updateEstimate);updateEstimate();$('#saveTraining').onclick=async()=>{let min=Number($('#tMin').value);if(min<=0){toast('Informe a duração');return}let date=$('#tDate').value,estimate=getEstimate();await put('training',{id:old?.id||id(),date,type:$('#tType').value,minutes:min,km:Number($('#tKm').value)||null,effort:Number($('#tEffort').value)||null,note:$('#tNote').value,kcalEstimate:estimate?.kcal||null,estimateWeightKg:estimate?.weightKg||null,estimateMet:estimate?.met||null});closeModal();await refresh();toast(old?'Treino atualizado':'Treino registrado')}}async function deleteTraining(k){if(confirm('Excluir este treino?')){await del('training',k);await refresh();toast('Treino removido')}}async function addWater(){let ml=250;await put('logs',{id:id(),date:state.date,time:new Date().toTimeString().slice(0,5),kind:'water',ml});await refresh();toast(`+${ml} ml registrados`)}

function templateEditor(existingId=null){let old=existingId?state.meals.find(x=>x.id===existingId):null,items=old?(old.items||[]).map(x=>({...x})):[];showModal(`<div class="row between"><h2>${old?'Editar modelo':'Criar modelo'}</h2><button class="iconbtn" id="closeModal">×</button></div><div class="field"><label>Nome do modelo</label><input id="mealName" value="${esc(old?.name||'')}" placeholder="Ex.: Meu almoço"></div><div class="field"><label>Ingredientes · selecione alimentos e quantidades</label><input id="mealFind" placeholder="Buscar ingrediente"></div><div class="searchresults" id="mealResults"></div><div id="mealItems" class="small"></div><button class="primary" id="saveTemplate" style="width:100%;margin-top:12px">${old?'Salvar alterações':'Salvar modelo'}</button>`);$('#closeModal').onclick=closeModal;const draw=()=>{$('#mealItems').innerHTML=items.map((x,i)=>`<div class="listitem"><span>${esc(x.name)} · ${esc(x.unit)}</span><span class="actions"><input data-mi-qty="${i}" aria-label="Quantidade de ${esc(x.name)}" type="number" min="0.1" step="any" value="${x.qty}" style="width:85px"><button data-mi="${i}" class="linkbtn danger">×</button></span></div>`).join('');document.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.mi,1);draw()});document.querySelectorAll('[data-mi-qty]').forEach(e=>e.oninput=()=>items[Number(e.dataset.miQty)].qty=Number(e.value)||0)};$('#mealFind').oninput=()=>{$('#mealResults').innerHTML=state.foods.filter(f=>f.name.toLowerCase().includes($('#mealFind').value.toLowerCase())).slice(0,8).map(f=>`<button class="result" data-mf="${f.id}">${esc(f.name)} · ${f.serving} ${esc(f.unit)}</button>`).join('');document.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id===b.dataset.mf);items.push({foodId:f.id,name:f.name,qty:Number(f.serving)||1,unit:f.unit});draw()})};draw();$('#saveTemplate').onclick=async()=>{let name=$('#mealName').value.trim();if(!name||!items.length||items.som async function repeatYesterday(meal){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()-1);let y=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,items=state.logs.filter(x=>x.date===y&&x.kind==='food'&&x.meal===meal);if(!items.length){toast(`Não há ${meal.toLowerCase()} registrada ontem`);return}if(!confirm(`Adicionar ${items.length} item(ns) do ${meal.toLowerCase()} de ontem?`))return;for(let x of items)await put('logs',{...x,id:id(),date:state.date,time:new Date().toTimeString().slice(0,5)});await refresh();toast('Refeição de ontem repetida')}async function saveDiaryMealAsTemplate(meal){let items=logsDay().filter(x=>x.meal===meal);if(!items.length)return;let name=prompt('Nome para este modelo de refeição',meal);if(!name?.trim())return;await put('meals',{id:id(),name:name.trim(),items:items.map(x=>({foodId:x.foodId,name:x.foodName,qty:Number(x.qty),unit:x.unit}))});await refresh();toast('Refeição salva como modelo')}

async function initData(){let foods=await all('foods'),foodMap=new Map(foods.map(f=>[f.id,f])),updates=[];for(let x of foodsSeed){let saved=foodMap.get(x.id);if(!saved){updates.push(x);foodMap.set(x.id,x)}else if(saved.seed&&Number(saved.catalogVersion||0)<3){let untouched=!saved.customized&&(Number(saved.catalogVersion||0)>=2||LEGACY_SEED_SIGNATURES[x.id]===seedSignature(saved));if(untouched){let next={...x,favorite:saved.favorite??x.favorite};updates.push(next);foodMap.set(x.id,next)}else{let next={...saved,...(x.tacoItemId?{tacoItemId:x.tacoItemId,aliases:x.aliases}:{}),catalogVersion:3,customized:true};updates.push(next);foodMap.set(x.id,next)}}}for(let x of TACO_ALL){let mappedSeed=foodsSeed.find(f=>f.tacoItemId===x.tacoItemId),mappedFood=mappedSeed&&foodMap.get(mappedSeed.id);if(mappedFood&&!mappedFood.customized)continue;let key='taco-'+x.tacoItemId;if(!foodMap.has(key)){let next={...x,id:key};updates.push(next);foodMap.set(key,next)}}if(updates.length)await bulkPut('foods',updates);let meals=await all('meals');if(!meals.length)for(let m of mealSeeds){await put('meals',{id:id(),name:m.name,items:m.items.map(([name,qty])=>({name,qty,foodId:foodsSeed.find(f=>f.name===name||f.legacyName===name)?.id,unit:'g'}))})}let s=await all('settings');if(!s.length)await put('settings',{id:'main',...state.settings})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelector('#themeBtn').onclick=()=>{state.settings.dark=!state.settings.dark;saveSettings()};
async function checkStoragePersistence(){try{if(!navigator.storage?.persisted)return null;return await navigator.storage.persisted()}catch{return false}}
async function requestStoragePersistence(){try{if(!navigator.storage?.persist)return null;return !!(await navigator.storage.persist())}catch{return false}}
async function start(){if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg.waiting&&navigator.serviceWorker.controller)updateToast(reg);reg.addEventListener('updatefound',()=>{let worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)updateToast(reg)})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}).catch(()=>{})};db=await openDB();await initData();await refresh();checkStoragePersistence().then(value=>{state.storagePersistent=value;if(state.page==='settings')render()})}let lastLocalDay=today();function checkDateRollover(){let now=today();if(now!==lastLocalDay){let wasToday=state.date===lastLocalDay;lastLocalDay=now;if(wasToday){state.date=now;render()}}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDateRollover()});setInterval(checkDateRollover,60000);start().catch(e=>{console.error('NutriTrack startup failed',e);$('#app').innerHTML=`<div class="card"><strong>Não foi possível carregar o NutriTrack.</strong><p class="muted small">${esc(e?.name||'Erro')}: ${esc(e?.message||'sem detalhes')}</p><button class="secondary" id="retryApp">Tentar novamente</button></div>`;$('#retryApp').onclick=()=>location.reload()});
})();
</script>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="NutriTrack: diário nutricional privado, local e offline."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <title>NutriTrack</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="interface.css" />
    <link rel="stylesheet" href="capture.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div>
          <strong>NutriTrack</strong><small>Seu diário, no seu ritmo</small>
        </div>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Alternar tema">
        ◐
      </button>
    </header>
    <nav class="tabs" aria-label="Navegação">
      <button class="tab active" data-page="today"><span>◷</span>Hoje</button
      ><button class="tab" data-page="plan"><span>☷</span>Plano</button
      ><button class="tab" data-page="calendar"><span>▦</span>Calendário</button
      ><button class="tab" data-page="progress"><span>⌁</span>Progresso</button
      ><button class="tab" data-page="settings"><span>⚙</span>Ajustes</button>
    </nav>
    <main class="wrap" id="app"></main>
    <button class="fab" id="addFab" aria-label="Adicionar alimento">+</button>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="modal" id="modal">
      <div
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        tabindex="-1"
      ></div>
    </div>
    <script src="exercise-estimates.js"></script>
    <script src="food-catalog.js"></script>
    <script src="nutrition-utils.js"></script>
    <script src="label-parser.js"></script>
    <script src="capture.js"></script>
    <script src="capture-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
